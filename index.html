<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Immersive Window S2</title>
<style>
:root{--x:0;--y:0;--z:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:relative;width:100%;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;background:radial-gradient(circle at 72% 52%,#ffd08b 0 3%,#f78d5b 16%,transparent 30%),linear-gradient(#86acd0,#d6aeb2 40%,#f3976c 68%,#526276)}
.layer{position:absolute;left:-12%;right:-12%;bottom:0;will-change:transform}.b{position:absolute;bottom:0;background:#17202a;border-radius:2px 2px 0 0}.b:after{content:"";position:absolute;inset:8% 12%;background:repeating-linear-gradient(0deg,transparent 0 11px,#ffd98a3a 12px 14px),repeating-linear-gradient(90deg,transparent 0 12px,#ffd98a2c 13px 15px)}
#far{height:43%;transform:translate(calc(var(--x)*-.10px),calc(var(--y)*.06px)) scale(calc(1.02 + var(--z)*.00010))}
#mid{height:49%;transform:translate(calc(var(--x)*-.34px),calc(var(--y)*.13px)) scale(calc(1.04 + var(--z)*.00018))}
#near{height:58%;transform:translate(calc(var(--x)*-.78px),calc(var(--y)*.24px)) scale(calc(1.08 + var(--z)*.00028))}
#frame:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5.5vw;background:#111318}#mullion{position:absolute;left:31%;top:0;bottom:0;width:2.7vw;background:#111319;box-shadow:0 0 18px #000b}#sill{position:absolute;left:0;right:0;bottom:0;height:6vh;background:#101319}
#bed{position:absolute;left:-8%;right:-8%;bottom:-8%;height:25%;background:radial-gradient(ellipse at 50% 12%,#343a43,#1b1f25 55%,#101319 85%);border-radius:50% 50% 0 0/25% 25% 0 0}
#hud{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px}.card{background:#07090db5;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px)}#title{font-size:13px;font-weight:800}#sub,#read{font-size:10.5px;line-height:1.4;color:#ffffffc0}#read{text-align:right;min-width:96px}
#camwrap{position:absolute;right:12px;top:92px;width:92px;height:124px;border-radius:14px;overflow:hidden;border:1px solid #ffffff24;display:none;background:#000}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px}button{flex:1;border:1px solid #ffffff24;background:#0a0d12d9;color:white;padding:12px;border-radius:13px;font-weight:700}
#hint{position:absolute;left:12px;right:12px;bottom:68px;background:#05070aa0;border:1px solid #ffffff18;padding:8px 10px;border-radius:12px;font-size:10.5px;text-align:center}
#status{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);background:#05070be8;padding:10px 12px;border-radius:12px;font-size:11px;opacity:0;transition:.2s;max-width:80%;text-align:center}.show{opacity:1}
</style></head><body><div id="app"><div id="scene">
<div id="far" class="layer">
<div class="b" style="left:2%;width:7%;height:44%;opacity:.7"></div><div class="b" style="left:12%;width:8%;height:61%;opacity:.7"></div><div class="b" style="left:25%;width:8%;height:52%;opacity:.7"></div><div class="b" style="left:38%;width:8%;height:72%;opacity:.7"></div><div class="b" style="left:51%;width:8%;height:60%;opacity:.7"></div><div class="b" style="left:65%;width:7%;height:88%;opacity:.7"></div><div class="b" style="left:77%;width:9%;height:64%;opacity:.7"></div><div class="b" style="left:90%;width:7%;height:72%;opacity:.7"></div></div>
<div id="mid" class="layer"><div class="b" style="left:0%;width:11%;height:43%"></div><div class="b" style="left:14%;width:11%;height:67%"></div><div class="b" style="left:30%;width:10%;height:50%"></div><div class="b" style="left:44%;width:12%;height:75%"></div><div class="b" style="left:61%;width:11%;height:56%"></div><div class="b" style="left:78%;width:13%;height:70%"></div></div>
<div id="near" class="layer"><div class="b" style="left:-2%;width:20%;height:36%;background:#10161d"></div><div class="b" style="left:20%;width:15%;height:45%;background:#10161d"></div><div class="b" style="left:74%;width:18%;height:47%;background:#10161d"></div><div class="b" style="left:94%;width:16%;height:61%;background:#10161d"></div></div>
<div id="frame"><div id="mullion"></div><div id="sill"></div></div><div id="bed"></div></div>
<div id="hud"><div class="card"><div id="title">IMMERSIVE WINDOW — S2</div><div id="sub">Face Tracking · New York Sunset</div></div><div id="read" class="card">X 0 mm<br>Y 0 mm<br>Z 0 mm<br>MODE SAFE</div></div>
<div id="camwrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="hint">Đặt iPhone cố định. Bật camera rồi dịch đầu trái/phải, lên/xuống, tiến/lùi.</div>
<div id="controls"><button id="start">Bật Face Tracking</button><button id="cal">Calibrate</button></div><div id="status"></div></div>
<script type="module">
import {FilesetResolver,FaceDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";
const root=document.documentElement,cam=document.getElementById("cam"),wrap=document.getElementById("camwrap"),start=document.getElementById("start"),cal=document.getElementById("cal"),read=document.getElementById("read"),status=document.getElementById("status");
let det=null,running=false,last=-1,base=null,fx=0,fy=0,fz=0,lastSeen=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function toast(s){status.textContent=s;status.classList.add("show");setTimeout(()=>status.classList.remove("show"),1600)}
function apply(mode){root.style.setProperty("--x",fx.toFixed(2));root.style.setProperty("--y",fy.toFixed(2));root.style.setProperty("--z",fz.toFixed(2));read.innerHTML=`X ${(fx*4).toFixed(0)} mm<br>Y ${(-fy*3).toFixed(0)} mm<br>Z ${(fz*3).toFixed(0)} mm<br>MODE ${mode}`}
async function init(){
 if(det)return;
 toast("Đang tải Face Detector...");
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
 det=await FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},runningMode:"VIDEO",minDetectionConfidence:.55});
}
function setBase(b){base={cx:(b.originX+b.width/2)/cam.videoWidth,cy:(b.originY+b.height/2)/cam.videoHeight,w:b.width/cam.videoWidth};fx=fy=fz=0;apply("FACE");toast("Đã calibrate")}
async function begin(){
 try{
   await init();
   const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});
   cam.srcObject=s;await cam.play();wrap.style.display="block";running=true;start.textContent="Face Tracking: ON";requestAnimationFrame(loop);
 }catch(e){console.error(e);toast("Không bật được camera/model. Kiểm tra quyền Camera trong Safari rồi tải lại trang.")}
}
function loop(){
 if(!running)return;
 if(cam.readyState>=2&&cam.currentTime!==last){
   last=cam.currentTime;
   const r=det.detectForVideo(cam,performance.now()),d=r.detections?.[0],b=d?.boundingBox;
   if(b){
     const cx=(b.originX+b.width/2)/cam.videoWidth,cy=(b.originY+b.height/2)/cam.videoHeight,w=b.width/cam.videoWidth;
     lastSeen=performance.now();if(!base)setBase(b);
     const tx=clamp((base.cx-cx)*460,-75,75),ty=clamp((cy-base.cy)*390,-60,60),tz=clamp(((w-base.w)/Math.max(.06,base.w))*120,-55,70);
     fx=lerp(fx,tx,.22);fy=lerp(fy,ty,.22);fz=lerp(fz,tz,.22);apply("FACE");
   }
 }
 if(base&&performance.now()-lastSeen>700){fx=lerp(fx,0,.05);fy=lerp(fy,0,.05);fz=lerp(fz,0,.05);apply("SAFE")}
 requestAnimationFrame(loop);
}
start.onclick=()=>{if(!running)begin()};cal.onclick=()=>{base=null;toast("Nhìn thẳng vào camera để calibrate lại")};apply("SAFE");
</script></body></html>
