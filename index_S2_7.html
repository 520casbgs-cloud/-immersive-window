<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>Immersive Window S2.7</title>
<style>
:root{
  --hx:0;--hy:0;--hz:0;
  --backX:0px;--backY:0px;--backS:1.06;
  --farX:0px;--farY:0px;--farS:1.06;
  --midX:0px;--midY:0px;--midS:1.06;
  --heroX:0px;--heroY:0px;--heroS:1.06;
  --sideX:0px;--sideY:0px;--sideS:1.06;
  --foreX:0px;--foreY:0px;--foreS:1.06;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#05070a}
#window{position:absolute;inset:0;overflow:hidden;background:#0b0d11}
.layer{position:absolute;inset:-9%;background-size:cover;background-position:center;background-repeat:no-repeat;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
#back{transform:translate3d(var(--backX),var(--backY),0) scale(var(--backS))}
#far{transform:translate3d(var(--farX),var(--farY),0) scale(var(--farS))}
#mid{transform:translate3d(var(--midX),var(--midY),0) scale(var(--midS))}
#hero{transform:translate3d(var(--heroX),var(--heroY),0) scale(var(--heroS))}
#left,#right{transform:translate3d(var(--sideX),var(--sideY),0) scale(var(--sideS))}
#fore{transform:translate3d(var(--foreX),var(--foreY),0) scale(var(--foreS))}
#glass{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 32%,rgba(2,4,8,.08));pointer-events:none}
#frame{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;height:max(2.4vh,env(safe-area-inset-top));background:#0a0c10f1}
#lframe{position:absolute;left:0;top:0;bottom:0;width:1.8vw;background:linear-gradient(90deg,#090b0f,#171a20)}
#rframe{position:absolute;right:0;top:0;bottom:0;width:1.2vw;background:linear-gradient(90deg,#171a20,#090b0f)}
#mullion{position:absolute;left:31%;top:0;bottom:0;width:7px;background:linear-gradient(90deg,#0a0c10,#20242b,#0a0c10);box-shadow:0 0 6px #0008}
#sill{position:absolute;left:0;right:0;bottom:0;height:3.8vh;background:linear-gradient(#181b21,#0b0d11);box-shadow:0 -4px 12px #0007}

#hud{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;z-index:6}
.card{background:#05070b90;border:1px solid #ffffff20;border-radius:14px;padding:9px 11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#title{font-size:13px;font-weight:800}#sub{font-size:10.2px;color:#ffffffc2;margin-top:3px}#read{font-size:10.2px;line-height:1.45;text-align:right;min-width:108px;font-variant-numeric:tabular-nums}

#scenePicker{position:absolute;left:12px;top:94px;z-index:7;display:flex;flex-direction:column;gap:6px}
.sceneBtn{min-width:132px;text-align:left;padding:9px 10px;border-radius:11px;border:1px solid #ffffff18;background:#080b10b8;color:#fff;font-size:11px;backdrop-filter:blur(12px)}
.sceneBtn.active{border-color:#44d36d;box-shadow:0 0 0 1px #44d36d55 inset}

#camwrap{position:absolute;right:12px;top:92px;width:84px;height:112px;border-radius:14px;overflow:hidden;border:1px solid #ffffff20;display:none;background:#000;z-index:6}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#hint{position:absolute;left:12px;right:12px;bottom:62px;background:#05070a78;border:1px solid #ffffff10;padding:7px 10px;border-radius:12px;font-size:10.1px;text-align:center;color:#ffffffcc;z-index:6}
#ctrl{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;z-index:7}
button{border:1px solid #ffffff1f;background:#090c11d8;color:#fff;padding:11px;border-radius:13px;font-weight:700;backdrop-filter:blur(12px)}
#status{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);background:#05070bea;padding:10px 12px;border-radius:12px;font-size:11px;opacity:0;transition:.2s;max-width:82%;text-align:center;z-index:9}
.show{opacity:1!important}
.debugOff #read,.debugOff #camwrap,.debugOff #hint,.debugOff #scenePicker{display:none!important}
.debugOff #hud{right:auto}
@media(max-width:700px){#ctrl{grid-template-columns:1fr 1fr}.sceneBtn{min-width:118px}}
</style>
</head>
<body>
<div id="app">
  <div id="window">
    <div id="back" class="layer"></div>
    <div id="far" class="layer"></div>
    <div id="mid" class="layer"></div>
    <div id="hero" class="layer"></div>
    <div id="left" class="layer"></div>
    <div id="right" class="layer"></div>
    <div id="fore" class="layer"></div>
    <div id="glass"></div>
    <div id="frame"><div id="top"></div><div id="lframe"></div><div id="rframe"></div><div id="mullion"></div><div id="sill"></div></div>
  </div>

  <div id="hud">
    <div class="card"><div id="title">IMMERSIVE WINDOW — S2.7</div><div id="sub">Exclusive 4K Layers · Head-Coupled Perspective · Face Tracking</div></div>
    <div id="read" class="card">X 0<br>Y 0<br>Z 0<br>MODE SAFE</div>
  </div>

  <div id="scenePicker">
    <button class="sceneBtn active" data-scene="scene1_newyork">Scene 1 · New York</button>
    <button class="sceneBtn" data-scene="scene2_newyork">Scene 2 · New York</button>
    <button class="sceneBtn" data-scene="scene3_cairo">Scene 3 · Cairo</button>
  </div>

  <div id="camwrap"><video id="cam" autoplay muted playsinline></video></div>
  <div id="hint">S2.7 · Giữ thiết bị cố định · Calibrate · dịch đầu chậm 10–20 cm. Exclusive layers giúp giảm tàn ảnh.</div>
  <div id="ctrl">
    <button id="start">Bật Face Tracking</button>
    <button id="cal">Calibrate</button>
    <button id="reset">Reset</button>
    <button id="debug">Ẩn Debug</button>
  </div>
  <div id="status"></div>
</div>

<script type="module">
import {FilesetResolver,FaceDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

const root=document.documentElement, app=document.querySelector("#app");
const cam=document.querySelector("#cam"),camw=document.querySelector("#camwrap");
const start=document.querySelector("#start"),cal=document.querySelector("#cal"),reset=document.querySelector("#reset"),debug=document.querySelector("#debug");
const read=document.querySelector("#read"),status=document.querySelector("#status");

let det=null,running=false,last=-1,base=null;
let hx=0,hy=0,hz=0,seen=0,debugOn=true,currentScene="scene1_newyork";
const C=(v,a,b)=>Math.max(a,Math.min(b,v)),L=(a,b,k)=>a+(b-a)*k;

function toast(s){status.textContent=s;status.classList.add("show");setTimeout(()=>status.classList.remove("show"),1500)}
function setScene(scene){
  currentScene=scene;
  const p=`${scene}/`;
  document.querySelector("#back").style.backgroundImage=`url("${p}back.jpg")`;
  document.querySelector("#far").style.backgroundImage=`url("${p}far.webp")`;
  document.querySelector("#mid").style.backgroundImage=`url("${p}mid.webp")`;
  document.querySelector("#hero").style.backgroundImage=`url("${p}hero.webp")`;
  document.querySelector("#left").style.backgroundImage=`url("${p}left.webp")`;
  document.querySelector("#right").style.backgroundImage=`url("${p}right.webp")`;
  document.querySelector("#fore").style.backgroundImage=`url("${p}fore.webp")`;
  document.querySelectorAll(".sceneBtn").forEach(b=>b.classList.toggle("active",b.dataset.scene===scene));
  toast("Đã đổi scene");
}
document.querySelectorAll(".sceneBtn").forEach(b=>b.onclick=()=>setScene(b.dataset.scene));

function apply(mode){
  // Conservative exclusive-layer parallax to minimize ghosting.
  const zBase=1.070 + hz*0.00055;
  const sets=[
    ["back",.05,.03,0.00],
    ["far", .12,.07,.02],
    ["mid", .25,.14,.05],
    ["hero",.40,.22,.08],
    ["side",.55,.30,.11],
    ["fore",.75,.42,.15]
  ];
  for(const [n,gx,gy,gz] of sets){
    root.style.setProperty(`--${n}X`,`${hx*gx}px`);
    root.style.setProperty(`--${n}Y`,`${-hy*gy}px`);
    root.style.setProperty(`--${n}S`,(zBase+hz*gz*0.0001).toFixed(4));
  }
  read.innerHTML=`X ${Math.round(hx*4)} mm<br>Y ${Math.round(hy*3)} mm<br>Z ${Math.round(hz*3)} mm<br>MODE ${mode}`;
}

async function init(){
  if(det)return;
  toast("Đang tải Face Detector...");
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
  det=await FaceDetector.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},
    runningMode:"VIDEO",minDetectionConfidence:.60
  });
}
function setBase(b){
  base={cx:(b.originX+b.width/2)/cam.videoWidth,cy:(b.originY+b.height/2)/cam.videoHeight,w:b.width/cam.videoWidth};
  hx=hy=hz=0;apply("FACE");toast("Đã calibrate");
}
async function begin(){
  try{
    await init();
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});
    cam.srcObject=s;await cam.play();camw.style.display="block";running=true;start.textContent="Face Tracking: ON";requestAnimationFrame(loop);
  }catch(e){console.error(e);toast("Kiểm tra quyền Camera của trình duyệt rồi tải lại trang.")}
}
function loop(){
  if(!running)return;
  if(cam.readyState>=2&&cam.currentTime!==last){
    last=cam.currentTime;
    const r=det.detectForVideo(cam,performance.now()),b=r.detections?.[0]?.boundingBox;
    if(b){
      const cx=(b.originX+b.width/2)/cam.videoWidth,cy=(b.originY+b.height/2)/cam.videoHeight,w=b.width/cam.videoWidth;
      seen=performance.now();if(!base)setBase(b);

      // dead-zone removes micro jitter
      let tx=(base.cx-cx)*285, ty=(base.cy-cy)*220, tz=((w-base.w)/Math.max(.06,base.w))*55;
      if(Math.abs(tx)<1.2)tx=0;if(Math.abs(ty)<1.1)ty=0;if(Math.abs(tz)<.8)tz=0;
      tx=C(tx,-38,38);ty=C(ty,-28,28);tz=C(tz,-22,30);

      hx=L(hx,tx,.085);hy=L(hy,ty,.085);hz=L(hz,tz,.075);
      apply("FACE");
    }
  }
  if(base&&performance.now()-seen>700){
    hx=L(hx,0,.025);hy=L(hy,0,.025);hz=L(hz,0,.025);apply("SAFE");
  }
  requestAnimationFrame(loop);
}
start.onclick=()=>{if(!running)begin()};
cal.onclick=()=>{base=null;toast("Nhìn thẳng vào camera để calibrate lại")};
reset.onclick=()=>{base=null;hx=hy=hz=0;apply("SAFE");toast("Đã reset")};
debug.onclick=()=>{debugOn=!debugOn;app.classList.toggle("debugOff",!debugOn);debug.textContent=debugOn?"Ẩn Debug":"Hiện Debug"};

setScene(currentScene); apply("SAFE");
</script>
</body>
</html>
