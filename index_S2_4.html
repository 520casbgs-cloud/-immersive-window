<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Immersive Window S2.4</title>
<style>
:root{--x:0;--y:0;--z:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#scene{position:absolute;inset:0;overflow:hidden;background:#111}.l{position:absolute;inset:-6%;background-size:cover;background-position:center;transform-origin:50% 50%;will-change:transform}
#bg{background-image:url("assets/background.jpg");transform:translate(calc(var(--x)*-.01px),calc(var(--y)*.008px)) scale(calc(1.06 + var(--z)*.00003))}
#mid{background-image:url("assets/mid.png");transform:translate(calc(var(--x)*-.055px),calc(var(--y)*.026px)) scale(calc(1.06 + var(--z)*.00005))}
#emp{background-image:url("assets/empire.png");transform:translate(calc(var(--x)*-.135px),calc(var(--y)*.05px)) scale(calc(1.06 + var(--z)*.00008))}
#right{background-image:url("assets/right.png");transform:translate(calc(var(--x)*-.21px),calc(var(--y)*.07px)) scale(calc(1.06 + var(--z)*.00010))}
#fore{background-image:url("assets/foreground.png");transform:translate(calc(var(--x)*-.30px),calc(var(--y)*.10px)) scale(calc(1.06 + var(--z)*.00013))}
#v{position:absolute;inset:0;background:linear-gradient(90deg,#05070b22,transparent 9%,transparent 91%,#05070b18),linear-gradient(0deg,#05070b28,transparent 24%)}
#m{position:absolute;left:31%;top:0;bottom:0;width:1vw;min-width:7px;max-width:11px;background:linear-gradient(90deg,#0a0c10,#1b1f25,#0a0c10);box-shadow:0 0 7px #0008}
#top{position:absolute;left:0;right:0;top:0;height:max(3.2vh,env(safe-area-inset-top));background:#0d0f13ee}
#sill{position:absolute;left:0;right:0;bottom:0;height:4.4vh;background:linear-gradient(#171a20,#0b0d11)}
#hud{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.card{background:#05070b90;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;backdrop-filter:blur(14px)}
#title{font-size:13px;font-weight:800}#sub,#read{font-size:10.4px;color:#ffffffc8;margin-top:3px}#read{text-align:right;line-height:1.45}
#camw{position:absolute;right:12px;top:94px;width:88px;height:118px;border-radius:14px;overflow:hidden;border:1px solid #ffffff22;display:none;background:#000}#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#hint{position:absolute;left:12px;right:12px;bottom:63px;background:#05070a88;border:1px solid #ffffff12;padding:8px;border-radius:12px;font-size:10.4px;text-align:center}
#ctrl{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px}button{flex:1;border:1px solid #ffffff20;background:#090c11cf;color:#fff;padding:11px;border-radius:13px;font-weight:700}
#status{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);background:#05070be8;padding:10px;border-radius:12px;font-size:11px;opacity:0;transition:.2s}.show{opacity:1!important}
</style></head><body>
<div id="scene"><div id="bg" class="l"></div><div id="mid" class="l"></div><div id="emp" class="l"></div><div id="right" class="l"></div><div id="fore" class="l"></div><div id="v"></div><div id="top"></div><div id="m"></div><div id="sill"></div></div>
<div id="hud"><div class="card"><div id="title">IMMERSIVE WINDOW — S2.4</div><div id="sub">Seamless 2.5D · Face Tracking</div></div><div id="read" class="card">X 0 mm<br>Y 0 mm<br>Z 0 mm<br>MODE SAFE</div></div>
<div id="camw"><video id="cam" autoplay muted playsinline></video></div><div id="hint">Đặt iPhone cố định · Calibrate · dịch đầu chậm 10–20 cm.</div>
<div id="ctrl"><button id="start">Bật Face Tracking</button><button id="cal">Calibrate</button></div><div id="status"></div>
<script type="module">
import {FilesetResolver,FaceDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";
const R=document.documentElement,cam=document.querySelector("#cam"),camw=document.querySelector("#camw"),start=document.querySelector("#start"),cal=document.querySelector("#cal"),read=document.querySelector("#read"),status=document.querySelector("#status");
let det=null,running=false,last=-1,base=null,x=0,y=0,z=0,seen=0;const C=(v,a,b)=>Math.max(a,Math.min(b,v)),L=(a,b,k)=>a+(b-a)*k;
function toast(s){status.textContent=s;status.classList.add("show");setTimeout(()=>status.classList.remove("show"),1500)}
function apply(mode){R.style.setProperty("--x",x.toFixed(2));R.style.setProperty("--y",y.toFixed(2));R.style.setProperty("--z",z.toFixed(2));read.innerHTML=`X ${(x*4).toFixed(0)} mm<br>Y ${(-y*3).toFixed(0)} mm<br>Z ${(z*3).toFixed(0)} mm<br>MODE ${mode}`}
async function init(){if(det)return;toast("Đang tải Face Detector...");const v=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");det=await FaceDetector.createFromOptions(v,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},runningMode:"VIDEO",minDetectionConfidence:.58})}
function setBase(b){base={cx:(b.originX+b.width/2)/cam.videoWidth,cy:(b.originY+b.height/2)/cam.videoHeight,w:b.width/cam.videoWidth};x=y=z=0;apply("FACE");toast("Đã calibrate")}
async function begin(){try{await init();const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});cam.srcObject=s;await cam.play();camw.style.display="block";running=true;start.textContent="Face Tracking: ON";requestAnimationFrame(loop)}catch(e){console.error(e);toast("Kiểm tra quyền Camera của Safari rồi tải lại trang.")}}
function loop(){if(!running)return;if(cam.readyState>=2&&cam.currentTime!==last){last=cam.currentTime;const r=det.detectForVideo(cam,performance.now()),b=r.detections?.[0]?.boundingBox;if(b){const cx=(b.originX+b.width/2)/cam.videoWidth,cy=(b.originY+b.height/2)/cam.videoHeight,w=b.width/cam.videoWidth;seen=performance.now();if(!base)setBase(b);x=L(x,C((base.cx-cx)*340,-48,48),.115);y=L(y,C((cy-base.cy)*285,-38,38),.115);z=L(z,C(((w-base.w)/Math.max(.06,base.w))*78,-34,46),.105);apply("FACE")}}if(base&&performance.now()-seen>700){x=L(x,0,.035);y=L(y,0,.035);z=L(z,0,.035);apply("SAFE")}requestAnimationFrame(loop)}
start.onclick=()=>{if(!running)begin()};cal.onclick=()=>{base=null;toast("Nhìn thẳng vào camera để calibrate lại")};apply("SAFE");
</script></body></html>
